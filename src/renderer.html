<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wyze Monitor</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">W</div>
      <div>
        <h1>Wyze Monitor</h1>
        <p>go2rtc / WebRTC passthrough</p>
      </div>
    </div>

    <div class="statusbar" id="statusbar">
      <div class="chip" id="chipLive"><span class="dot" id="liveDot"></span><b id="liveText">--/4</b><i>LIVE</i></div>
      <div class="chip"><b id="fpsText">--</b><i>AVG OUT</i></div>
      <div class="chip"><b id="mbpsText">--</b><i>Mbps</i></div>
      <div class="chip"><b id="engineText">--</b><i>ENGINE</i></div>
      <div class="chip"><b id="resText">--</b><i>GRID RES</i></div>
      <div class="chip"><b id="clockText">--:--:--</b><i>LOCAL</i></div>
    </div>

    <div class="controls">
      <div class="segmented" id="qualityControls" role="group" aria-label="Grid quality"></div>
      <button id="smooth30Toggle" class="action" type="button">Smooth 30 On</button>
      <div class="camera-menu-wrap">
        <button id="cameraMenuButton" class="action" type="button" aria-expanded="false">Cameras</button>
        <div id="cameraMenu" class="camera-menu hidden" role="menu"></div>
      </div>
      <button id="diagnosticsButton" class="action" type="button">Diagnostics</button>
      <button id="recordToggle" class="action record-action" type="button" aria-pressed="false">Record</button>
      <a id="recordingDownload" class="action recording-download hidden" href="#" download>Download recording</a>
      <button id="refreshAll" class="action">Refresh</button>
      <button id="fullscreen" class="action">Fullscreen</button>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <template id="camera-card-template">
    <section class="camera-card">
      <div class="camera-frame">
        <div class="player" data-player></div>
        <div class="camera-label"></div>
        <div class="status">Connecting</div>
        <div class="smooth30-badge tile-smooth30 hidden" data-smooth30-badge>SYNTHETIC 30</div>
        <div class="metrics">
          <div class="fps" data-fps>FPS --</div>
          <div class="timestamp"></div>
        </div>
      </div>
      <footer>
        <strong></strong>
        <span></span>
        <button class="enlarge" title="Enlarge camera">Enlarge</button>
        <button class="refresh" title="Reconnect camera">Reconnect</button>
      </footer>
    </section>
  </template>

  <div class="focus hidden" id="focusView" aria-hidden="true">
    <div class="focus-toolbar">
      <div>
        <strong id="focusName"></strong>
        <span id="focusDetails"></span>
      </div>
      <div class="focus-toolbar-actions">
        <span class="smooth30-badge hidden" id="smooth30Badge">SYNTHETIC 30</span>
        <button id="focusClose" type="button">Close</button>
      </div>
    </div>
    <div class="focus-frame">
      <div class="player" id="focusPlayer"></div>
      <div class="metrics focus-metrics">
        <div class="fps" id="focusFps">FPS --</div>
        <div class="timestamp focus-time" id="focusTimestamp"></div>
      </div>
    </div>
  </div>

  <div class="diagnostics hidden" id="diagnosticsView" aria-hidden="true">
    <div class="diagnostics-panel" role="dialog" aria-modal="true" aria-labelledby="diagnosticsTitle">
      <div class="diagnostics-header"><strong id="diagnosticsTitle">Camera diagnostics</strong><button id="diagnosticsClose" type="button">Close</button></div>
      <div class="diagnostics-table-wrap"><table><thead><tr><th>Camera</th><th>State</th><th>Resolution</th><th>Source</th><th>Output</th><th>Bitrate</th><th>Engine</th></tr></thead><tbody id="diagnosticsRows"></tbody></table></div>
    </div>
  </div>

  <script type="module" src="/renderer.js"></script>
</body>
</html>
