name: wyze-monitor-rpi

services:
  config-init:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: ..
      dockerfile: raspberry-pi/Dockerfile
    image: wyze-monitor-rpi-web:local
    command: ["node", "raspberry-pi/generate-go2rtc-config.js"]
    environment:
      PI_HOST_IP: ${PI_HOST_IP:?Set PI_HOST_IP in .env}
      WEBRTC_PUBLIC_PORT: ${WEBRTC_PUBLIC_PORT:-18555}
    volumes:
      - ../cameras.yaml:/app/cameras.yaml:ro
      - ./runtime:/app/raspberry-pi/runtime
    restart: "no"
    network_mode: none

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    restart: unless-stopped
    volumes:
      - ./runtime/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "${PI_HOST_IP}:${WEBRTC_PUBLIC_PORT:-18555}:8555/tcp"
      - "${PI_HOST_IP}:${WEBRTC_PUBLIC_PORT:-18555}:8555/udp"
    expose:
      - "1984"
    networks:
      - monitor
    security_opt:
      - no-new-privileges:true

  monitor-web:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: ..
      dockerfile: raspberry-pi/Dockerfile
    image: wyze-monitor-rpi-web:local
    restart: unless-stopped
    init: true
    depends_on:
      - go2rtc
    environment:
      PORT: 8765
      GO2RTC_HOST: go2rtc
      GO2RTC_API_PORT: 1984
      DEFAULT_QUALITY: ${DEFAULT_QUALITY:-sub}
    volumes:
      - ../cameras.yaml:/app/cameras.yaml:ro
      - recording-tmp:/recordings
    ports:
      - "${PI_HOST_IP}:${FRIENDLY_HTTP_PORT:-80}:8765"
      - "${PI_HOST_IP}:${MONITOR_PUBLIC_PORT:-18765}:8765"
    networks:
      - monitor
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

networks:
  monitor:
    name: wyze-monitor-rpi-net
    driver: bridge

volumes:
  recording-tmp:
